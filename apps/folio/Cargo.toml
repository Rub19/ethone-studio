[package]
name = "folio"
version = "0.9.1"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
hayro = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.47"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
studio-ocr = { version = "0.1.0", path = "../../crates/studio-ocr" }
studio-core = { version = "0.1.0", path = "../../crates/studio-core" }
studio-ui = { version = "0.1.0", path = "../../crates/studio-ui" }

[build-dependencies]
winresource = "0.1.34"
