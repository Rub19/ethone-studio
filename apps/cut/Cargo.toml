[package]
name = "cut"
version = "0.3.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
cpal = "0.18.2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
studio-core = { version = "0.1.0", path = "../../crates/studio-core" }
studio-ui = { version = "0.1.0", path = "../../crates/studio-ui" }
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1.34"
