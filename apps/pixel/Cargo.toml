[package]
name = "pixel"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.18.0"
studio-core = { version = "0.1.0", path = "../../crates/studio-core" }
studio-ui = { version = "0.1.0", path = "../../crates/studio-ui" }

[build-dependencies]
winresource = "0.1.34"
