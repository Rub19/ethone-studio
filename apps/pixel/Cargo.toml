[package]
name = "pixel"
version = "0.3.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
rayon = "1.12.0"
rfd = "0.18.0"
studio-core = { version = "0.1.0", path = "../../crates/studio-core" }
studio-ui = { version = "0.1.0", path = "../../crates/studio-ui" }

[build-dependencies]
winresource = "0.1.34"
