[package]
name = "ethone-mcp"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "ethone-mcp"
path = "src/main.rs"

[dependencies]
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
imagepipe = "0.5.1"
krilla = "0.8.2"
krilla-svg = "0.8.1"
rayon = "1.12.0"
resvg = "0.49.0"
resvg47 = { package = "resvg", version = "0.47" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
studio-core = { version = "0.1.0", path = "../../crates/studio-core" }
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4"] }
ttf-parser = "0.25"
