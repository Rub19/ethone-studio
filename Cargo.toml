[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.package.naga]
opt-level = "s"

[profile.release.package.wgpu-core]
opt-level = "s"

[profile.release.package.wgpu-hal]
opt-level = "s"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

